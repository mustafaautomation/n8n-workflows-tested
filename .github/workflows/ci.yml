name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  N8N_IMAGE: n8nio/n8n:2.44.7

jobs:
  validate:
    name: Schema, lint rules, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Validate workflows against the schema and lint rules
        run: npm run lint:workflows
      - run: npm test

  e2e:
    name: Import into n8n (Docker) and execute against mocks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start mock services
        run: |
          nohup node mock/server.mjs > mock.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:4010/__requests >/dev/null && exit 0; sleep 0.5; done
          cat mock.log; exit 1
      - name: Import and publish the workflows (n8n CLI)
        run: |
          set -euo pipefail
          docker volume create n8n_data
          run() { docker run --rm -v n8n_data:/home/node/.n8n -v "$PWD/workflows:/workflows:ro" "$N8N_IMAGE" "$@"; }
          run import:workflow --separate --input=/workflows
          for id in $(jq -r .id workflows/*.json); do run publish:workflow --id="$id"; done
      - name: Start n8n
        run: |
          docker run -d --name n8n -p 5678:5678 \
            --add-host=host.docker.internal:host-gateway \
            -v n8n_data:/home/node/.n8n \
            -e N8N_BLOCK_ENV_ACCESS_IN_NODE=false \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e SLACK_WEBHOOK_URL=http://host.docker.internal:4010/slack/webhook \
            -e SHEETS_API_BASE=http://host.docker.internal:4010/sheets \
            -e SHEET_ID=test-sheet \
            -e HEALTH_TARGETS=http://host.docker.internal:4010/status/200,http://host.docker.internal:4010/status/503,http://host.docker.internal:9/ \
            "$N8N_IMAGE"
          for i in $(seq 1 60); do curl -fsS http://localhost:5678/healthz/readiness >/dev/null && exit 0; sleep 2; done
          docker logs n8n; exit 1
      - name: End-to-end tests
        run: npm run test:e2e
      - name: n8n and mock logs
        if: always()
        run: |
          docker logs n8n 2>&1 | tail -100 || true
          cat mock.log || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - run: ./gitleaks git --redact --verbose --exit-code 1 .
